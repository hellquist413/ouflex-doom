<script>
(function () {
  var data = JSON.parse(document.getElementById('payload').textContent);
  var form = document.getElementById('f'), input = document.getElementById('p'), user = document.getElementById('u');
  var btn = document.getElementById('b'), msg = document.getElementById('m');
  var KEY = 'ouflex-unlock';
  function bytes(b64) { var s = atob(b64), a = new Uint8Array(s.length); for (var i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; }
  async function decrypt(pw) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt: bytes(data.salt), iterations: data.iter, hash:'SHA-256' },
      base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: bytes(data.iv) }, key, bytes(data.ct));
    return new TextDecoder().decode(pt);
  }
  async function unlock(pw, fromStore) {
    btn.disabled = true; msg.style.color = '#aab2dc'; msg.textContent = 'Unlocking…';
    try {
      var html = await decrypt(pw);
      try { sessionStorage.setItem(KEY, pw); } catch (e) {}
      window.__ouflexSecret = pw;
      document.open(); document.write(html); document.close();
    } catch (e) {
      btn.disabled = false; msg.style.color = '#ff9d9d';
      msg.textContent = fromStore ? '' : 'Wrong username or password.';
      if (fromStore) { try { sessionStorage.removeItem(KEY); } catch (e2) {} }
      input.focus(); input.select();
    }
  }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = user.value.trim().toLowerCase();
    if (name && input.value) unlock(name + '\n' + input.value, false);
    else { msg.style.color = '#ff9d9d'; msg.textContent = 'Enter both username and password.'; }
  });
  var saved = null; try { saved = sessionStorage.getItem(KEY); } catch (e) {}
  if (saved) unlock(saved, true);
})();
</script>
